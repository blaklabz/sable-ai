<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sable</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #111;
            color: #eee;
        }

        h1 {
            margin-bottom: 5px;
        }

        #status {
            color: #999;
            margin-bottom: 20px;
        }

        #chat {
            min-height: 500px;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .message {
            margin-bottom: 20px;
        }

        .user {
            color: #bbb;
        }

        .sable {
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            margin-top: 15px;
            padding: 12px;
            background: #181818;
            color: #eee;
            border: 1px solid #444;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Sable</h1>
<div id="status">User: {{ user_id }}</div>

<div id="chat"></div>

<textarea
    id="input"
    placeholder="Talk to Sable. Multiline paste is safe here."></textarea>

<button onclick="sendMessage()">Send</button>

<script>
    const history = [];

    function addMessage(role, text) {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");
        div.className = "message " + role;

        const name = role === "user" ? "Toby" : "Sable";

        div.textContent = name + ":\n" + text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById("input");
        const message = input.value.trim();

        if (!message) {
            return;
        }

        addMessage("user", message);
        input.value = "";

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: history
            })
        });

        const data = await response.json();

        addMessage("sable", data.reply);

        history.push({
            role: "user",
            content: message
        });

        history.push({
            role: "assistant",
            content: data.reply
        });
    }
</script>

</body>
</html>
